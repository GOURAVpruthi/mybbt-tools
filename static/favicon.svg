<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Extremely bright and premium metallic gold gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#E5B730" />
      <stop offset="70%" stop-color="#B88A00" />
      <stop offset="100%" stop-color="#664D00" />
    </linearGradient>

    <!-- Metallic Silver / White Gradient -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0E5EC" />
      <stop offset="100%" stop-color="#9BA6B5" />
    </linearGradient>
    
    <!-- Mask for the Right Diamond -->
    <mask id="maskRight">
      <rect x="-500" y="-500" width="1000" height="1000" fill="white" />
      <path d="M 30 -40 L 30 120" fill="none" stroke="black" stroke-width="125" stroke-linecap="round" />
    </mask>

    <!-- Mask for the Left Diamond -->
    <mask id="maskLeft">
      <rect x="-500" y="-500" width="1000" height="1000" fill="white" />
      <path d="M -30 40 L -30 -120" fill="none" stroke="black" stroke-width="125" stroke-linecap="round" />
    </mask>
  </defs>
  
  <!-- Navy Background to ensure the silver/gold pops on BOTH light and dark browser tabs -->
  <rect width="512" height="512" rx="112" fill="#040d1f" />
  
  <g transform="translate(256, 256) scale(1.1) rotate(45)">
    <!-- Right Diamond (GOLD) -->
    <rect x="-30" y="-180" width="210" height="210" rx="70" fill="none" stroke="url(#gold)" stroke-width="85" mask="url(#maskRight)" />
    
    <!-- Left Diamond (SILVER/WHITE) -->
    <rect x="-180" y="-30" width="210" height="210" rx="70" fill="none" stroke="url(#silver)" stroke-width="85" mask="url(#maskLeft)" />
  </g>
</svg>
