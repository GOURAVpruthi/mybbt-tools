<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E0A0" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA8015" />
      <stop offset="100%" stop-color="#6A4E00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Navy Background -->
  <rect width="512" height="512" rx="80" fill="#040d1f" />
  
  <!-- Decorative Dots -->
  <circle cx="110" cy="170" r="10" fill="url(#goldGrad)" />
  <circle cx="402" cy="170" r="10" fill="url(#goldGrad)" />
  
  <!-- The Symbol (Scaled and Moved Up) -->
  <g transform="translate(256, 170) scale(0.7) rotate(45)" filter="url(#shadow)">
    <!-- Top-Right Diamond -->
    <path d="M 0 -80 L 60 -80 A 20 20 0 0 1 80 -60 L 80 0 A 20 20 0 0 1 60 20 L 0 20 A 20 20 0 0 1 -20 0 L -20 -60 A 20 20 0 0 1 0 -80 Z" fill="none" stroke="url(#goldGrad)" stroke-width="36" stroke-linejoin="round" />
    <!-- Bottom-Left Diamond -->
    <path d="M 0 80 L -60 80 A 20 20 0 0 1 -80 60 L -80 0 A 20 20 0 0 1 -60 -20 L 0 -20 A 20 20 0 0 1 20 0 L 20 60 A 20 20 0 0 1 0 80 Z" fill="none" stroke="url(#goldGrad)" stroke-width="36" stroke-linejoin="round" />
    <!-- Overlays -->
    <path d="M 20 0 L 20 60 A 20 20 0 0 1 0 80" fill="none" stroke="url(#goldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -20 0 L -20 -60 A 20 20 0 0 1 0 -80" fill="none" stroke="url(#goldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- MY BBT Text -->
  <text x="256" y="340" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="76" text-anchor="middle" dominant-baseline="central" letter-spacing="4">
    <tspan fill="#ffffff">MY </tspan>
    <tspan fill="url(#goldGrad)">BBT</tspan>
  </text>
  
  <!-- Subtitle 1 -->
  <text x="256" y="415" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="18" fill="#a0aabf" text-anchor="middle" dominant-baseline="central" letter-spacing="5">
    &#x2014; MY BUSINESS BLUETOOTH &#x2014;
  </text>
  
  <!-- Subtitle 2 -->
  <text x="256" y="455" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="15" fill="#D4AF37" text-anchor="middle" dominant-baseline="central" letter-spacing="3">
    &#x2014; ONE PLATFORM. ALL SOLUTIONS. &#x2014;
  </text>
</svg>
